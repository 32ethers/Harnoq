        duplicate_candidates:
          type: array
          items:
            $ref: '#/components/schemas/IntegrationDuplicateCandidateRecord'
        proposed_items:
          type: array
          items:
            $ref: '#/components/schemas/IntegrationProposedItemRecord'
        external_resources:
