              key: {type: string}
              kind: {type: string, enum: [journey, nfr]}
              subject: {type: string}
              source: {type: string}
              driver: {type: string}
              found_in_round: {type: integer, minimum: 1}
              existing_item_number: {type: string}
        rerun_evidence:
          type: array
          items:
            type: object
            required: [item_number, command, exit_code, stdout, stderr]
            properties:
              item_number: {type: string}
              command: {type: string}
              exit_code: {type: integer}
              stdout: {type: string}
              stderr: {type: string}

