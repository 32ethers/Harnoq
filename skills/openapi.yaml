        external_resources:
          $ref: '#/components/schemas/IntegrationExternalResources'

    IntegrationExternalResources:
      type: object
      required: [scan_evidence_keys, design_audits, resources]
      properties:
        scan_evidence_keys:
          type: array
          minItems: 1
          items: {type: string}
          description: Source-scan evidence auditing production configuration and code for external dependencies.
        design_audits:
          type: array
          items:
            type: object
            required: [design_number, resource_keys]
            properties:
              design_number: {type: string}
              resource_keys: {type: array, items: {type: string}}
              no_resources_reason: {type: string}
        resources:
          type: array
          items:
            $ref: '#/components/schemas/IntegrationExternalResource'

    IntegrationExternalResource:
      type: object
      required: [key, name, source, configuration, status]
      properties:
        key: {type: string}
        name: {type: string}
        source:
          type: string
          description: Exact design/code/configuration provenance. A waiver INTEG must carry the same source.
        configuration:
          type: string
          description: Actual configured resource version/location or endpoint; never credentials.
        status: {type: string, enum: [verified, missing, invalid, unverified, waived]}
        entry_keys: {type: array, items: {type: string}}
        uses_test_double: {type: boolean}
        operation: {type: string}
        observed_result: {type: string}
        readiness_evidence_key: {type: string}
        call_evidence_key: {type: string}
        preparation:
          type: string
          description: Required unless verified/waived; source/version, preparation steps, configured location and verification command, including any user action/cost.
        waiver_item_number: {type: string}

    IntegrationEvidenceRecord:
      type: object
      additionalProperties: false
      required: [key, role, command, exit_code, stdout, stderr]
      properties:
        key: {type: string}
        role:
          type: string
          enum:
            - entry-launch
            - entry-observation
            - entry-launch-observation
            - source-scan
            - skeleton
            - contract
            - caller
            - owner
            - test
            - other
            - resource-check
            - resource-call
        command:
          type: string
          description: Literal copy-pasteable command, without prose or ellipsis.
        exit_code: {type: integer}
        expected_exit_codes:
          type: array
          items: {type: integer}
          default: [0]
        stdout:
          type: string
          description: Relevant raw stdout inline; empty string when empty.
        stderr:
          type: string
          description: Relevant raw stderr inline; empty string when empty.

    IntegrationProductionEntryRecord:
      type: object
      additionalProperties: false
      required:
        - key
        - name
        - entry_type
        - operational_invocation
        - observable_boundary
        - executes_delivered_behavior
        - launch_evidence_key
        - observation_evidence_key
      properties:
        key: {type: string}
        name: {type: string}
        entry_type:
          type: string
          enum: [service, cli, browser, scheduled]
        operational_invocation:
          type: string
          description: Actual delivered-product launch/load; never build/test/dev/preview.
        observable_boundary: {type: string}
        executes_delivered_behavior: {type: boolean}
        launch_evidence_key: {type: string}
        observation_evidence_key: {type: string}

    IntegrationDesignCoverageRecord:
      type: object
      additionalProperties: false
      required:
        - key
        - design_number
        - selected_solution_sha256
        - design_scope_sha256
        - declared_part_keys
        - seam_keys
      properties:
        key:
          type: string
          description: Must equal the fully qualified design_number.
        design_number: {type: string}
        selected_solution_sha256: {type: string}
        design_scope_sha256: {type: string}
        declared_part_keys:
          type: array
          items: {type: string}
        seam_keys:
          type: array
          items: {type: string}

    IntegrationSourceScanRecord:
      type: object
      additionalProperties: false
      required:
        - key
        - language
        - roots
        - scan_evidence_key
        - collision_keys
        - different_name_candidate_keys
      properties:
        key: {type: string}
        language: {type: string}
        roots:
          type: array
          minItems: 1
          items: {type: string}
        scan_evidence_key: {type: string}
        collision_keys:
          type: array
          items: {type: string}
        different_name_candidate_keys:
          type: array
          items: {type: string}

    IntegrationDeclaredPartRecord:
      type: object
      additionalProperties: false
      required: [key, design_number, name, declaration]
      properties:
        key: {type: string}
        design_number:
          type: string
          description: Fully qualified P*-DESIGN-* business number.
        name:
          type: string
          description: Exactly one part copied from selected_solution.
        declaration:
          type: string
          description: Exact declaration copied verbatim from selected_solution.

    IntegrationAssemblyRow:
      type: object
      additionalProperties: false
      required: [key, reachable, entry_keys, path, gap_key, missing_edge, evidence_keys]
      properties:
        key:
          type: string
          description: Must equal exactly one declared_parts key.
        reachable: {type: boolean}
        entry_keys:
          type: array
          items: {type: string}
        path:
          type: array
          items: {type: string}
        gap_key:
          type: string
          nullable: true
          description: One missing-edge key when unreachable; null when reachable.
        missing_edge:
          type: string
          nullable: true
          description: Exact missing producer -> consumer edge; null when reachable.
        evidence_keys:
          type: array
          items: {type: string}

    IntegrationSeamRow:
      type: object
      additionalProperties: false
      required:
        - key
        - declaring_design_number
        - producer_design_number
        - consumer_design_number
        - producer
        - consumer
        - declaration
        - wiring
        - wired
        - integration_verified
        - evidence_keys
      properties:
        key: {type: string}
        declaring_design_number: {type: string}
        producer_design_number: {type: string}
        consumer_design_number: {type: string}
        producer:
          type: string
          description: Exactly one producer endpoint or contract.
        consumer:
          type: string
          description: Exactly one consumer endpoint or contract.
        declaration:
          type: string
          description: Exact seam declaration copied verbatim from the declaring design_scope.
        wiring: {type: string}
        wired: {type: boolean}
        integration_verified:
          type: boolean
          description: True only when a passing test directly exercises this seam.
        test:
          type: string
          nullable: true
          description: Exact test node/command, or null when missing.
        test_evidence_key:
          type: string
          nullable: true
        evidence_keys:
          type: array
          items: {type: string}

    IntegrationImplementationRecord:
      type: object
      additionalProperties: false
      required: [module, identifier]
      properties:
        module: {type: string}
        identifier: {type: string}

    IntegrationIdentifierCollisionRecord:
      type: object
      additionalProperties: false
      required: [key, identifier, implementations, evidence_keys]
      properties:
        key: {type: string}
        identifier:
          type: string
          description: Complete identifier exactly equal in every implementation.
        implementations:
          type: array
          minItems: 2
          items:
            $ref: '#/components/schemas/IntegrationImplementationRecord'
        evidence_keys:
          type: array
          items: {type: string}

    IntegrationDuplicateCandidateRecord:
      type: object
      additionalProperties: false
      required:
        - key
        - discovery
        - collision_keys
        - implementations
        - responsibility
        - verdict
        - caller_semantics
        - divergence_is_defect
        - rationale
        - evidence_keys
      properties:
        key: {type: string}
        discovery:
          type: string
          enum: [exact-name, different-name]
        collision_keys:
          type: array
          items: {type: string}
        implementations:
          type: array
          minItems: 2
          items:
            $ref: '#/components/schemas/IntegrationImplementationRecord'
        responsibility: {type: string}
        verdict:
          type: string
          enum: [converge, retain]
        canonical_owner: {type: string, nullable: true}
        caller_semantics: {type: string}
        divergence_is_defect: {type: boolean}
        boundary_fit: {type: string, nullable: true}
        baseline_evidence_key: {type: string, nullable: true}
        rationale: {type: string}
        evidence_keys:
          type: array
          items: {type: string}
        contract_evidence_keys:
          type: array
          items: {type: string}
        caller_evidence_keys:
          type: array
          items: {type: string}
        owner_evidence_keys:
          type: array
          items: {type: string}

    IntegrationProposedItemRecord:
      type: object
      additionalProperties: false
      required: [key, kind, subject, source, found_in_round]
      properties:
        key:
          type: string
          description: Exactly one assembly-gap, unsatisfied-seam, or converge key.
        kind:
          type: string
          enum: [assembly, seam, duplicate]
        subject:
          type: string
          description: Complete standalone proposed content; no shared tail/reference.
        source:
          type: string
          description: Complete standalone provenance with qualified business numbers.
        found_in_round: {type: integer, minimum: 1}
        existing_item_number: {type: string, nullable: true}

    DeliveryItemUpdateRequest:
      type: object
      required: [item_number]
      properties:
        project_number:
          type: string
          description: Optional when item_number already exists; server can infer the project.
        actor:
          type: string
        session_id:
          type: string
        idempotency_key:
          type: string
        item_number:
          type: string
          description: Existing INTEG-* or SYS-* business number.
        kind:
          type: string
          enum: [assembly, seam, duplicate, journey, nfr]
        subject:
          type: string
          description: >
            Replacement content. Markdown — use real line breaks, never the
            literal characters backslash-n.
        source:
          type: string
          description: >
            Replacement provenance line; may not be blank. Copy fully qualified
            business numbers exactly. Plain text.
        driver:
          type: string
          description: Replacement driving method (kind=journey/nfr only). Plain text.
        status:
          type: string
          enum: [open, covered, waived]
          description: >
            covered requires current executable stage-run evidence; waived
            requires waive_reason — both enforced server-side.
        covered_by:
          type: string
          description: Required when status=covered. Name the exact check discharging this item.
        evidence_command:
          type: string
          description: Exact executable command used for this item.
        evidence_output:
          type: string
          description: Raw output from the command.
        evidence_exit_code:
          type: integer
          description: Actual exit code; covered requires zero.
        verified_revision:
          type: string
          description: Code revision checked; must match the active stage run.
        repair_record:
          type: string
          description: What failed, what changed and how the result was verified.
        blocked_reason:
          type: string
          description: Required resource or access that blocks this item.
        waive_reason:
          type: string
          description: Required when status=waived. Who decided not to do it, and why.
        found_in_round:
          type: integer

    DesignCaseCreateRequest:
      type: object
      required: [feature_number]
      properties:
        project_number:
          type: string
          description: The project to create this design in.
        actor:
          type: string
        session_id:
          type: string
        idempotency_key:
          type: string
        feature_number:
          type: string
          description: >
            Owning FEATURE-* (required). A design carries no INPUT-* link of
            its own — read the relevant INPUT-* material and cite it in
            prose (problem_statement) instead.

    DesignCaseUpdateRequest:
      type: object
      required: [design_number]
      properties:
        project_number:
          type: string
          description: Optional when design_number already exists; server can infer the project.
        actor:
          type: string
        session_id:
          type: string
        idempotency_key:
          type: string
        design_number:
          type: string
          description: Existing design case business number, e.g. P1-DESIGN-3.
        feature_number:
          type: string
          description: Move this design to a different FEATURE-*. Plain text business number.
        problem_statement:
          type: string
          description: >
            The INPUT-*'s problem restated as a DESIGN problem: what must be
            decided and why. Markdown — use real line breaks, never the
            literal characters backslash-n.
        mined_requirements:
          type: string
          description: >
            需求(我理解你要的是): the requirement as mined at the design stage,
            one line per requirement, each marked 用户确认 / 我补的(已认可) /
            待确认. The only place the mined requirement is stored — no
            upstream object holds it. Markdown — use real line breaks, never
            the literal characters backslash-n.
        verifies_nfr:
          type: string
          description: >
            Which project-constitution nfr_baseline COMMITMENT rows THIS
            design proves, one per line, quoting the metric name as the
            constitution writes it and saying how it is measured. Write 无
            when this design proves none — most do not — since confirming
            requires an answer once the baseline states any commitment, and
            blank cannot be told apart from never having been asked. Rows
            marked `direction` are not claimed here and must not become
            acceptance criteria. A commitment no design claims is a project
            promise with no owner. Markdown — use real line breaks, never
            the literal characters backslash-n.
        design_scope:
          type: string
          description: >
            What this design owns vs. leaves to neighboring DESIGN-*. The
            requirement itself goes in mined_requirements, not here.
            Markdown — use real line breaks, never the literal characters
            backslash-n.
        non_goals:
          type: string
          description: >
            What this design explicitly does NOT cover. Markdown — use real
            line breaks, never the literal characters backslash-n.
        assumptions:
          type: string
          description: >
            Assumptions this design relies on. Markdown — use real line
            breaks, never the literal characters backslash-n.
        constraints:
          type: string
          description: >
            Concrete bounds the solution must honor. Markdown — use real
            line breaks, never the literal characters backslash-n.
        selected_solution:
          type: string
          description: >
            The chosen rules/behavior and buildable shape (components, data,
            flow, contracts). Markdown — use real line breaks, never the
            literal characters backslash-n.
        selection_reason:
          type: string
          description: >
            Why this option beat the concrete alternatives. Markdown — use
            real line breaks, never the literal characters backslash-n.
        risks:
          type: string
          description: >
            Concrete failure modes of the chosen solution and how they're
            contained. Markdown — use real line breaks, never the literal
            characters backslash-n.
        test_strategy:
          type: string
          description: >
            How the tester will prove the acceptance criteria. Markdown —
            use real line breaks, never the literal characters backslash-n.
        acceptance_criteria:
          type: string
          description: >
            Verifiable given/when/then covering happy path plus failure/edge
            paths. Markdown — use real line breaks, never the literal
            characters backslash-n.
        reviewer:
          type: string
          description: Who reviewed this design. Plain text.
        impact_areas:
          type: array
          description: >
            List drawn only from a fixed enum: frontend, backend, database,
            api, auth, infrastructure, ci_cd, testing, security, performance,
            documentation.
          items:
            type: string
        rejected_solutions:
          type: array
          description: List of alternatives considered and rejected, each an object.
          items:
            type: object
            additionalProperties: true
        open_questions:
          type: array
          description: List of unresolved questions for this design.
          items:
            type: string

    SourceRequirementConfirmRequest:
      type: object
      required: [source_requirement_number]
      properties:
        project_number:
          type: string
          description: Optional when source_requirement_number already exists; server can infer the project.
        actor:
          type: string
        session_id:
          type: string
        idempotency_key:
          type: string
        source_requirement_number:
          type: string
          description: Existing SourceRequirement business number, e.g. P1-INPUT-6.

    SourceRequirementLifecycleRequest:
      type: object
      required: [source_requirement_number]
      properties:
        project_number:
          type: string
          description: Optional when source_requirement_number already exists and is not deleted; server can infer the project from live rows.
        actor:
          type: string
        session_id:
          type: string
        idempotency_key:
          type: string
        source_requirement_number:
          type: string
          description: Existing SourceRequirement business number, e.g. P1-INPUT-6.

    ChangeRequestCreateRequest:
      type: object
      required: [project_number, reason]
      properties:
        project_number:
          type: string
        actor:
          type: string
        session_id:
          type: string
        idempotency_key:
          type: string
        reason:
          type: string
          description: Why the change is needed, in the user's terms.
        design_number:
          type: string
          description: DESIGN-* to be changed. Give this, or target_type=new.
        task_number:
          type: string
          description: >
            TASK-* whose DELIVERED code is what changes, when no specification
            moves. Use instead of design_number for a fix to merged work the
            design still describes correctly.
        also_changes_numbers:
          type: array
          items:
            type: string
          description: >
            Every OTHER DESIGN-*/TASK-* this same change rewrites. The impact
            analysis is DERIVED from the targets, so a design left off here does
            not merely go unmentioned — its tasks never enter the blast radius
            at all.
        target_type:
          type: string
          enum: [design_case, development_task, new]
          description: >
            Use 'new' (with no number) when the change is a NEW requirement
            rather than an edit - the default answer once a task has shipped.

    ChangeRequestLifecycleRequest:
      type: object
      required: [change_request_number]
      properties:
        project_number:
          type: string
          description: Optional when change_request_number already exists; server can infer the project.
        actor:
          type: string
        session_id:
          type: string
        idempotency_key:
          type: string
        change_request_number:
          type: string
          description: Existing ChangeRequest business number, e.g. P1-CR-2.
        resolution:
          type: string
          description: Required by close only - how it ended (made / dropped / rejected).

    DesignCaseConfirmRequest:
      type: object
      required: [design_number]
      properties:
        project_number:
          type: string
          description: Optional when design_number already exists; server can infer the project.
        actor:
          type: string
        session_id:
          type: string
        idempotency_key:
          type: string
        design_number:
          type: string
          description: Existing design case business number, e.g. P1-DESIGN-3.

    DesignCaseLifecycleRequest:
      type: object
      required: [design_number]
      properties:
        project_number:
          type: string
          description: Optional when design_number already exists and is not deleted; server can infer the project from live rows.
        actor:
          type: string
        session_id:
          type: string
        idempotency_key:
          type: string
        design_number:
          type: string
          description: Existing design case business number, e.g. P1-DESIGN-3.

    DesignCaseRestoreRequest:
      type: object
      required: [project_number, design_number]
      properties:
        project_number:
          type: string
          description: Required for restore because deleted rows cannot be used for live-object project inference.
        actor:
          type: string
        session_id:
          type: string
        idempotency_key:
          type: string
        design_number:
          type: string
          description: Deleted design case business number in the recycle bin, e.g. P1-DESIGN-3.

    DesignCaseCreateTaskRequest:
      type: object
      required: [design_number, title, task_type, goal, acceptance_criteria, constraints, non_goals]
      properties:
        project_number:
          type: string
          description: Optional when design_number already exists; server can infer the project.
        actor:
          type: string
        session_id:
          type: string
        idempotency_key:
          type: string
        design_number:
          type: string
          description: Existing design case business number, e.g. P1-DESIGN-3. Must be confirmed.
        title:
          type: string
          description: Short label for this task. Plain text.
        task_type:
          type: string
          description: >
            Plain text enum: feature, infrastructure, bug_fix, refactor,
            test, doc, mock_env, mock_data.
        priority:
          type: string
          description: Plain text enum.
        complexity:
          type: string
          description: Plain text enum.
        risk_level:
          type: string
          description: Plain text enum.
        goal:
          type: string
          description: >
            What this task BUILDS, concrete enough to start coding from.
            Markdown — use real line breaks, never the literal characters
            backslash-n.
        acceptance_criteria:
          type: string
          description: >
            The DESIGN's acceptance_criteria this task must satisfy. A
            restatement for the reader — qa is checked against the design's
            criteria and NEVER against these, so criteria invented here are
            criteria nothing will accept. If the design grew a capability with
            no criterion judging it, revise and re-confirm the DESIGN first (defer to
            the design in the default 1:1 case). Markdown — use real line
            breaks, never the literal characters backslash-n.
        constraints:
          type: string
          description: >
            Real bounds the task must honor, pulled from the design.
            Markdown — use real line breaks, never the literal characters
            backslash-n.
        non_goals:
          type: string
          description: >
            What this task explicitly does NOT do. Markdown — use real line
            breaks, never the literal characters backslash-n.

    Envelope:
      type: object
      description: Fixed 6-key skill response shape, extended with the resource payload.
      required: [object_type, object_id, status, change_summary, open_questions, next_step]
      properties:
        object_type:
          type: string
        object_id:
          oneOf:
            - type: string
            - type: integer
          description: Id of the primary affected/returned object.
        status:
          type: string
        change_summary:
          type: string
          description: Human-readable one-line summary of what happened.
        open_questions:
          type: array
          items:
            type: string
        next_step:
          type: string
          nullable: true
      additionalProperties: true
